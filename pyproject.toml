[project]
name = "squid-llms"
version = "0.1.0"
description = "Squid：一只从小养到大的 LLM。从零手搓的大模型工程实现。"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "tiktoken",
    "numpy",
    "pandas>=3.1.0",
    "tqdm>=4.70.1",
    "openai>=3.37.0",
    "safetensors>=0.8.0",
    "huggingface-hub>=2.4.0",
    "transformers>=5.22.1",
    "sentencepiece>=0.2.3",
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/squid"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
