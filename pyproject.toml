[project]
name = "squid-llms"
version = "0.1.0"
description = "Squid：一只从小养到大的 LLM。从零手搓的大模型工程实现。"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "tiktoken",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/squid"]
