<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lvchat · 本地模型对话</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6fb;
      --surface: rgba(255, 255, 255, 0.88);
      --text: #202333;
      --muted: #73788b;
      --line: #e4e7f0;
      --accent: #635bff;
      --user: #635bff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 8%, rgba(99, 91, 255, 0.12), transparent 34%),
        radial-gradient(circle at 88% 90%, rgba(41, 170, 225, 0.10), transparent 36%),
        var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
    }

    .app {
      width: min(860px, 100%);
      height: min(780px, calc(100vh - 64px));
      min-height: 480px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: 0 24px 80px rgba(40, 45, 80, 0.10);
      backdrop-filter: blur(18px);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-bottom: 1px solid var(--line);
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .logo {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 12px;
      color: white;
      background: linear-gradient(135deg, #756bff, #4f8ff7);
      font-weight: 700;
    }
    h1 { margin: 0; font-size: 20px; letter-spacing: -0.02em; }
    .model { color: var(--muted); font-size: 12px; }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 26px 24px;
      scroll-behavior: smooth;
    }

    .welcome {
      max-width: 520px;
      margin: 56px auto;
      text-align: center;
      color: var(--muted);
      line-height: 1.8;
    }
    .welcome h2 { color: var(--text); font-size: 24px; margin-bottom: 8px; }

    .message {
      display: flex;
      margin: 16px 0;
    }
    .message.user { justify-content: flex-end; }
    .bubble {
      max-width: 78%;
      padding: 12px 16px;
      border-radius: 18px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.65;
      font-size: 15px;
    }
    .assistant .bubble {
      background: #fff;
      border: 1px solid var(--line);
      border-top-left-radius: 6px;
    }
    .user .bubble {
      color: white;
      background: var(--user);
      border-top-right-radius: 6px;
    }
    .error .bubble { color: #b42318; background: #fff1f0; }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      margin: 0 20px 12px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
    }
    textarea {
      flex: 1;
      min-height: 40px;
      max-height: 140px;
      resize: none;
      border: 0;
      outline: 0;
      padding: 9px 8px;
      color: var(--text);
      background: transparent;
      font: inherit;
      line-height: 1.5;
    }
    button {
      min-width: 76px;
      height: 40px;
      border: 0;
      border-radius: 12px;
      color: white;
      background: var(--accent);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.55; cursor: wait; }
    .hint { margin: 0 24px 16px; color: var(--muted); font-size: 11px; text-align: center; }

    @media (max-width: 640px) {
      body { padding: 0; }
      .app { height: 100vh; min-height: 0; border-radius: 0; }
      header { padding: 16px; }
      .chat { padding: 18px 14px; }
      .bubble { max-width: 88%; }
      .composer { margin: 0 12px 10px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand">
        <div class="logo">lv</div>
        <div>
          <h1>lvchat</h1>
          <div class="model">model_v3 · Qwen2.5-0.5B Instruct · 本地推理</div>
        </div>
      </div>
    </header>

    <section id="chat" class="chat" aria-live="polite">
      <div id="welcome" class="welcome">
        <h2>和自己的模型聊一句</h2>
        <p>这是从零手搓模型、训练、评估到对话界面的最小闭环。<br>模型还很小，回答不完美，但每一行都在本地运行。</p>
      </div>
    </section>

    <form id="chat-form" class="composer" autocomplete="off">
      <textarea id="message" rows="1" aria-label="消息" placeholder="输入消息，Enter 发送，Shift+Enter 换行" required></textarea>
      <button id="send" type="submit">发送</button>
    </form>
    <p class="hint">当前为单会话演示 · 模型能力有限，请把回答当作实验结果</p>
  </main>

  <script>
    const form = document.getElementById('chat-form');
    const input = document.getElementById('message');
    const sendButton = document.getElementById('send');
    const chat = document.getElementById('chat');
    const welcome = document.getElementById('welcome');

    function addMessage(text, role) {
      const row = document.createElement('div');
      row.className = `message ${role}`;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      row.appendChild(bubble);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
    }

    function setBusy(busy) {
      sendButton.disabled = busy;
      sendButton.textContent = busy ? '生成中' : '发送';
    }

    async function sendMessage() {
      const message = input.value.trim();
      if (!message || sendButton.disabled) return;

      if (welcome) welcome.remove();
      addMessage(message, 'user');
      input.value = '';
      setBusy(true);

      try {
        const response = await fetch('/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({message}),
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        addMessage(data.response || '（模型返回了空内容）', 'assistant');
      } catch (error) {
        addMessage(`请求失败：${error.message}`, 'error');
      } finally {
        setBusy(false);
        input.focus();
      }
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      sendMessage();
    });

    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    input.focus();
  </script>
</body>
</html>
